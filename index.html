<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- LANDING -->
    <section id="landing">
      <nav>
        <div class="nav__container">
          <img src="./Library.svg" alt="library logo" class="logo" />
          <ul class="nav__links">
            <li>
              <a href="#" class="nav__link">Home</a>
            </li>
            <li>
              <a href="#" class="nav__link">Contacts</a>
            </li>
            <li>
              <a href="#features" class="nav__link nav__link--primary">Books</a>
            </li>
          </ul>
        </div>
      </nav>

      <header>
        <div class="header__container">
          <div class="header__description">
            <h1>America's most awarded online library platform</h1>
            <h2>
              Find your dream book with <span class="purple">Library</span>
            </h2>
            <a href="#features">
              <button class="btn">Browse Books</button>
            </a>
          </div>
          <figure class="header__img--wrapper">
            <img src="./Undraw_Books.svg" alt="" />
          </figure>
        </div>
      </header>
    </section>
    <!-- END LANDING -->
  </body>
</html>
